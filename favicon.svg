<!-- favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Основной градиент: голубой → фиолетовый → мятный -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7cc7ff"/>
      <stop offset="55%"  stop-color="#b58cff"/>
      <stop offset="100%" stop-color="#6affc4"/>
    </linearGradient>

    <!-- Мягкое свечение -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#b58cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#b58cff" stop-opacity="0"/>
    </radialGradient>

    <!-- Блик сверху — эффект стекла -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Фон: тёмный с округлением -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#04050a"/>

  <!-- Свечение позади букв -->
  <circle cx="32" cy="32" r="26" fill="url(#glow)"/>

  <!-- Стеклянная рамка -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5"
        fill="none" stroke="url(#grad)" stroke-opacity="0.5" stroke-width="1.2"/>

  <!-- Буквы "АМ" в стеклянном стиле -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
     font-weight="700" font-size="26" text-anchor="middle"
     fill="url(#grad)">
    <text x="32" y="43">АМ</text>
  </g>

  <!-- Верхний блик (эффект стекла) -->
  <rect x="2" y="2" width="60" height="28" rx="16" fill="url(#shine)"/>

  <!-- Тонкая световая кромка -->
  <path d="M10 4 Q32 1 54 4"
        stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"
        fill="none" stroke-linecap="round"/>

  <!-- Акцентная точка (пульс, как в навигации) -->
  <circle cx="52" cy="14" r="2.5" fill="#6affc4">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
</svg>